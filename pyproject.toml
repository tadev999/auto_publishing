[project]
name = "endo-agents"
version = "0.1.0"
description = "AI agents that turn Endogenism articles into short videos and publish them to Instagram Reels & TikTok."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "boto3>=1.34",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
endo = "endo_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/endo_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: long SQL/f-strings are clearer unwrapped. B008: typer.Option defaults are idiomatic.
ignore = ["E501", "B008"]
